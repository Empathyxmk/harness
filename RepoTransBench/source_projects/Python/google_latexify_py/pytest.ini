[pytest]
addopts = --disable-warnings
# prevent autoloading of third-party plugins, esp. legacy flexmock, if present
# This often resolves ModuleNotFoundError: No module named 'flexmock._pytest_plugin'
minversion = 6.0
# Ensure only files in src/ are collected (to avoid picking up system tests)
testpaths = src
python_files = *_test.py