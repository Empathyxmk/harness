// Add JaCoCo coverage plugin at the top if not present
apply plugin: 'jacoco'

buildscript {
    repositories {
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.jakewharton.sdkmanager:gradle-plugin:0.12.0'
        classpath 'com.android.tools.build:gradle:0.12.2'
        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:0.5'
    }
}

apply plugin: 'android-sdk-manager'
apply plugin: 'android-library'
apply plugin: 'com.jfrog.bintray'
apply plugin: 'maven-publish'

group = 'com.google.android'
version=0.1

android {
    compileSdkVersion 19
    buildToolsVersion "19.1.0"

    sourceSets {
        main {
            java.srcDirs         = ['src']
            resources.srcDirs    = ['res']
            res.srcDirs          = ['src']
            manifest.srcFile 'AndroidManifest.xml'
        }
        test {
            java.srcDirs = ['../test/src']
        }
    }

    lintOptions {
        abortOnError false
    }
}

task sourceJar(type: Jar) {
  from android.sourceSets.main.java.srcDirs
}

// JaCoCo test coverage
jacoco {
    toolVersion = "0.8.5"
}

test {
    jacoco {
        enabled = true
    }
    testLogging {
        events "passed", "failed", "skipped"
    }
}

task jacocoTestReport(type: JacocoReport, dependsOn: ['test']) {
    reports {
        xml.enabled true
        html.enabled true
    }
    sourceDirectories.setFrom files(android.sourceSets.main.java.srcDirs)
    classDirectories.setFrom fileTree(
        dir: "$buildDir/intermediates/classes/test/debug",
        include: ['**/*.class'],
        exclude: []
    )
    executionData.setFrom fileTree(
        dir: buildDir,
        include: [
            'jacoco/testDebug.exec',
            'outputs/code-coverage/connected/*.ec'
        ]
    )
}
 
task coverage(dependsOn: ['jacocoTestReport'])