// This is a .proto file; it's not C++.
// C++ protobuf compiler would generate files from this, but we keep it for parity.

syntax = "proto3";
package tutorial;

message Person {
  string name = 1;
  int32 id = 2;
  string email = 3;

  enum PhoneType {
    MOBILE = 0;
    HOME = 1;
    WORK = 2;
  }

  message PhoneNumber {
    string number = 1;
    PhoneType type = 2;
  }

  repeated PhoneNumber phone = 4;
}

message Other {
  string foo = 1;
  int32 index = 2;
}

message AddressBook {
  Other other = 1;
  repeated Person person = 2;
}