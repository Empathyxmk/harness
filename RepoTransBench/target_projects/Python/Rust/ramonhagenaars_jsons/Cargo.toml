[package]
name = "ramonhagenaars_jsons"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.5", features = ["serde", "v4"] }
indexmap = "2.2"
anyhow = "1.0"
lazy_static = "1.4"
itertools = "0.12"

[dev-dependencies]
rstest = "0.18"