[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-harness"
version = "1.0.0"
description = "Lean Codex + RepoTransBench repository migration harness"
requires-python = ">=3.10"

[project.scripts]
migration-harness = "migration_harness.cli:main"

[tool.setuptools.packages.find]
include = ["migration_harness*"]
